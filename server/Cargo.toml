[package]
name = "map-points-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros"
] }

validator = { version = "0.20", features = ["derive"] }

tower-http = { version = "0.6", features = ["cors"] }

thiserror = "2"